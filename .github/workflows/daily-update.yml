name: Refresh Neofetch Daily

on:
  schedule:
    - cron: '0 0 * * *' # Runs at 00:00 UTC every day
  workflow_dispatch:     # Allows manual trigger via GitHub Actions tab

permissions:
  contents: write

jobs:
  update-cache:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Bump Cache Buster with Today's Date
        run: |
          DATE_TAG=$(date +'%Y-%m-%d')
          sed -i -E "s/v=[0-9a-zA-Z_-]+/v=$DATE_TAG/g" README.md

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || (git commit -m "chore: refresh profile stats [$DATE_TAG]" && git push)
