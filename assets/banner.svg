<svg viewBox="0 0 1200 280" width="1200" height="280" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="rootagi banner">
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#8FBF8A" opacity="0.05"/>
    </pattern>
  </defs>

  <rect x="0" y="0" width="1200" height="280" rx="18" fill="#0B0F0D"/>
  <rect x="0" y="0" width="1200" height="280" rx="18" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="278" rx="17" fill="none" stroke="#20302A" stroke-width="1.5"/>

  <!-- text block -->
  <text x="60" y="96" font-family="'JetBrains Mono','Fira Code',monospace" font-size="16" fill="#E8A54B">guest@archlinux</text>
  <text x="220" y="96" font-family="'JetBrains Mono','Fira Code',monospace" font-size="16" fill="#65786C">:~$ whoami</text>

  <text x="58" y="168" font-family="'JetBrains Mono','Fira Code',monospace" font-size="58" font-weight="700" fill="#8FBF8A">rootagi</text>
  <rect x="300" y="130" width="14" height="42" fill="#8FBF8A">
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <line x1="60" y1="192" x2="60" y2="192" fill="none" stroke="#8FBF8A" stroke-width="2">
    <animate attributeName="x2" from="60" to="640" dur="0.9s" begin="0.2s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
  </line>

  <text x="60" y="224" font-family="'JetBrains Mono','Fira Code',monospace" font-size="18" fill="#D9E2DB">offensive security · systems programming</text>
  <text x="60" y="250" font-family="'JetBrains Mono','Fira Code',monospace" font-size="18" fill="#D9E2DB">red team tooling, built from first principles</text>

  <!-- signature motif: abstract compromise graph -->
  <g stroke="#3E5548" stroke-width="1.2" opacity="0.9">
    <line x1="960" y1="140" x2="880" y2="80"/>
    <line x1="960" y1="140" x2="1020" y2="66"/>
    <line x1="960" y1="140" x2="1100" y2="96"/>
    <line x1="960" y1="140" x2="870" y2="188"/>
    <line x1="960" y1="140" x2="1010" y2="212"/>
    <line x1="960" y1="140" x2="1110" y2="176"/>
    <line x1="1100" y1="96" x2="1110" y2="176"/>
    <line x1="880" y1="80" x2="870" y2="188"/>
  </g>
  <g fill="#5C7A64">
    <circle cx="880" cy="80" r="5"/>
    <circle cx="1020" cy="66" r="4"/>
    <circle cx="1100" cy="96" r="5"/>
    <circle cx="870" cy="188" r="4.5"/>
    <circle cx="1010" cy="212" r="5"/>
    <circle cx="1110" cy="176" r="4"/>
  </g>
  <circle cx="960" cy="140" r="9" fill="#E8A54B">
    <animate attributeName="r" values="9;11;9" dur="2.8s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
    <animate attributeName="opacity" values="1;0.75;1" dur="2.8s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
  </circle>
  <circle cx="960" cy="140" r="9" fill="none" stroke="#E8A54B" stroke-width="1" opacity="0.5">
    <animate attributeName="r" values="9;22;9" dur="2.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0;0.5" dur="2.8s" repeatCount="indefinite"/>
  </circle>
</svg>
